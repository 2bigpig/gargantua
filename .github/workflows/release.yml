name: Publish release downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        default: v0.2.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build locked source
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p artifacts
          cp gargantua.html artifacts/
          cd artifacts
          sha256sum gargantua.html > SHA256SUMS.txt
      # 在 GitHub 内生成和上传，避免本地下载域名连接中断影响发布。
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --draft --title "Gargantua $TAG · 4K Black Hole" --notes "Fixed 3840×2160 continuous animation. See README for downloads, usage and upstream MIT credits."
          gh release upload "$TAG" artifacts/gargantua.html artifacts/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest

