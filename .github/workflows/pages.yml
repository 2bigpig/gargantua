name: Deploy live black hole
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 只发布自包含演示，不把开发文件带入站点。
      - name: Prepare site
        run: |
          mkdir -p _site
          cp gargantua.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Verify published HTML
        run: |
          curl --fail --retry 10 --retry-delay 3 https://2bigpig.github.io/gargantua/ --output /tmp/live.html
          cmp gargantua.html /tmp/live.html
